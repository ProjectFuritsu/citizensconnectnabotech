<!doctype html>
<html lang="en-PH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The percent-sign placeholders below are filled by vite.config.js from
         the "site" section of src/Config/site.config.json. Pages then update
         the title, description and canonical link via usePageMeta. -->
    <title>%DEFAULT_TITLE%</title>
    <meta name="description" content="%DEFAULT_DESCRIPTION%" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Icons: SVG for modern browsers, ICO fallback, home-screen icons -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews (Facebook, Messenger, Viber, X, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:locale" content="en_PH" />
    <meta property="og:title" content="%DEFAULT_TITLE%" />
    <meta property="og:description" content="%DEFAULT_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%SITE_NAME%: Public information, made easy to find." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
